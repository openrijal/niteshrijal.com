# Baseline of HIGH and CRITICAL findings from the 2026-10-23 Trivy filesystem scan
# (trivy 0.76.1, scanners vuln,secret,misconfig, --severity HIGH,CRITICAL, --ignore-unfixed).
# Gitleaks 8.30.1 over full git history reported no secrets, so this repo has no .gitleaks.toml.
#
# Each entry is one advisory, one lockfile path, and one package URL including version.
# A new advisory, file, or package version does not match and still fails CI.
# security-scan.yml rejects any vulnerability entry that omits paths or purls.
# Remove an entry when that package version is no longer in the named lockfile.
